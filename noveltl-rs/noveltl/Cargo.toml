[package]
name = "noveltl"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# значок внутри exe — только при сборке на Windows
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
noveltl-core = { path = "../noveltl-core" }
serde_json = "1"
png = "0.17"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
# буфер обмена (режим «Буфер обмена» на всех ОС)
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
