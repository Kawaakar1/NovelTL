[package]
name = "noveltl-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
base64 = "0.22"
# распаковка скачанного словаря JMdict (.gz)
flate2 = "1"

# Windows: системный TLS (SChannel). Linux: rustls — не нужна системная OpenSSL, бинарник переносимее.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "socks", "system-proxy"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "system-proxy"] }
