# Сборка и тесты NovelTL для Linux. Готовый архив — в «Artifacts» запуска,
# а при метке версии (v0.4.4 и т. п.) он прикрепляется к релизу на GitHub.
name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # старая Ubuntu — бинарник запустится и на дистрибутивах со старой glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Системные библиотеки для окон
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev

      - name: Тесты
        working-directory: noveltl-rs
        run: cargo test --workspace

      - name: Сборка
        working-directory: noveltl-rs
        run: cargo build --release -p noveltl

      - name: Архив
        run: |
          VER=$(grep -m1 '^version' noveltl-rs/Cargo.toml | cut -d'"' -f2)
          NAME="NovelTL-$VER-linux-x86_64"
          mkdir "$NAME"
          cp noveltl-rs/target/release/noveltl "$NAME/noveltl"
          cp packaging/linux/install.sh packaging/linux/noveltl.png packaging/linux/README-Linux.txt "$NAME/"
          cp LICENSE "$NAME/"
          chmod +x "$NAME/noveltl" "$NAME/install.sh"
          tar czf "$NAME.tar.gz" "$NAME"
          echo "ARCHIVE=$NAME.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: NovelTL-linux
          path: ${{ env.ARCHIVE }}

      - name: В релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
